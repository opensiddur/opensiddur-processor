  - opens: וזאת התורה אשר שם משה
    urn: urn:x-opensiddur:text:prayer:vezot_hatorah
  - opens: ויהי נעם אדני אלהינו עלינו
    urn: urn:x-opensiddur:text:prayer:vihi_noam
  - opens: קוה אל יהוה חזק ויאמץ לבך
    urn: urn:x-opensiddur:text:prayer:qavveh_el_adonai
  - opens: וידבר יהוה אל משה לאמר צו את אהרן
    urn: urn:x-opensiddur:text:prayer:terumat_hadeshen
    note: "Leviticus 6:1-6, named by its subject"
  - opens: ברוך שם כבוד מלכותו לעולם ועד
    leaf: Counting the Omer
    urn: urn:x-opensiddur:text:prayer:sefirat_haomer/barukh_shem
  - opens: ברוך שם כבוד מלכותו לעולם ועד
    urn: urn:x-opensiddur:text:prayer:barukh_shem_kevod
    note: "the line said on its own (after אנא בכח, after the tefillin blessing)"

