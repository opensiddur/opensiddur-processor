# Curated URN choices for the Metsudah volumes (see equivalents.py). Each entry is found by the
# opening words of a block, compared as consonant skeletons; `leaf` limits it to one leaf, or to a
# list of leaves (the same text where each volume prints it).
#
# texts: the URN a block opening so is -- the collection's text it does the same job as, in
#        another rite's words, or the name a new text is given (a verse collage by its function or
#        common incipit, or a name shared with an opensiddur.org post).
#        `ends` gives the words the text ends with: only a block that has them is the text, and
#        a block that runs on past them, into a text the book does not mark, is cut there.
#        `with` lists words the block must also have. Of the choices a block matches, the one
#        with the longest opening wins, then the one whose ending reaches furthest into the
#        block (the full Kaddish, not the half Kaddish it opens with), then the one with more
#        `with` (the full Kaddish, with תתקבל, not the Mourner's).
#        `transcludes` names a text this one opens with: where the volume prints that text and
#        the block opens with its words, phrase for phrase, the text's file transcludes it and
#        holds only its own words after it (each larger Kaddish, the half Kaddish) -- unless the
#        English or rubrics there differ. A place transcluding it declares that text's variants
#        not printed.
# joins: a block opening so continues the text before it in its leaf; with `after`, only a text
#        that has those words (the Kaddish may run on at the end of the block before it).

