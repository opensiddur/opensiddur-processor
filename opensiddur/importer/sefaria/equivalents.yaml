# Curated URN choices for the Metsudah volumes (see equivalents.py). Each entry is found by the
# opening words of a block, compared as consonant skeletons; `leaf` limits it to one leaf.
#
# texts: the URN a block opening so is -- the collection's text it does the same job as, in
#        another rite's words, or the name a new text is given (a verse collage by its function or
#        common incipit, or a name shared with an opensiddur.org post).
# joins: a block opening so continues the text before it in its leaf.

texts:
  # -- The Shema and its blessings -------------------------------------------------------------
  - opens: אהבת עולם אהבתנו
    leaf: The Morning Prayers / The Blessings of Shema
    urn: urn:x-opensiddur:text:prayer:ahavah_rabbah
    note: "Nusach Sefard's morning second blessing before the Shema; Ashkenaz אהבה רבה, the same blessing and closing"
  - opens: תתברך לנצח צורנו
    urn: urn:x-opensiddur:text:prayer:yotzer_or/titbarakh
    note: "Sefard adds לנצח"
  - opens: ואמרו יהוה ימלוך לעולם ועד
    urn: urn:x-opensiddur:text:prayer:emet_veyatziv/adonai_yimlokh
  - opens: אל מלך נאמן
    urn: urn:x-opensiddur:text:prayer:shema/el_melekh_neeman
  - opens: שמע ישראל יהוה אלהינו יהוה אחד ברוך שם כבוד
    urn: urn:x-opensiddur:text:prayer:shema
    note: "the three paragraphs, joined below"
  - opens: והוא רחום יכפר עון ולא ישחית והרבה להשיב אפו ולא יעיר כל חמתו יהוה הושיעה
    urn: urn:x-opensiddur:text:prayer:vehu_rachum
    note: "before Maariv; two verses (Psalms 78:38, 20:10) named by their incipit"
  - opens: והוא רחום יכפר עון ולא ישחית והרבה להשיב אפו ולא יעיר כל חמתו אתה
    urn: urn:x-opensiddur:text:prayer:vehu_rachum_arokh
    note: "the long Vehu Rachum of Monday and Thursday mornings"

  # -- The Amidah ------------------------------------------------------------------------------
  - opens: נקדישך ונעריצך
    urn: urn:x-opensiddur:text:prayer:amidah/qedushah/neqaddesh
    note: "Nusach Sefard's Kedushah opening; Ashkenaz נקדש את שמך, the same part"
  - opens: לעומתם משבחים ואומרים
    urn: urn:x-opensiddur:text:prayer:amidah/qedushah/leummatam
    note: "Ashkenaz לעמתם ברוך יאמרו"
  - opens: כתר יתנו לך
    urn: urn:x-opensiddur:text:prayer:amidah/qedushah/naaritz
    note: "Nusach Sefard's Musaf Kedushah opening; Ashkenaz נעריצך ונקדישך"
  - opens: ועל הנסים ועל הפורקן
    urn: urn:x-opensiddur:text:prayer:al_hanissim
    note: "the opening Chanukah and Purim share; Birnbaum prints it with each"

  # -- Morning blessings and preparations ------------------------------------------------------
  - opens: ברוך אתה יהוה אלהינו מלך העולם הנותן לשכוי בינה
    urn: urn:x-opensiddur:text:prayer:birkhot_hashachar/lasekhvi
    note: "Ashkenaz אשר נתן לשכוי בינה"
  - opens: לשם יחוד קודשא בריך הוא
    leaf: The Morning Prayers / Putting on the Tefillin
    urn: urn:x-opensiddur:text:prayer:tefillin/hineni_mekhavven
    note: "the meditation before the tefillin, with Nusach Sefard's לשם יחוד"
  - opens: רבון כל העולמים ואדוני האדונים
    urn: urn:x-opensiddur:text:prayer:ribbon_kol_haolamim
  - opens: אל ארך אפים ומלא רחמים
    urn: urn:x-opensiddur:text:prayer:el_erekh_appayim
    note: "the second of the two forms Birnbaum's אל ארך אפים ורב חסד stands for"
  - opens: מי שגמלך טוב
    urn: urn:x-opensiddur:text:prayer:birkat_hagomel/response
  - opens: רבי ישמעאל אומר בשלש עשרה מדות
    urn: urn:x-opensiddur:text:prayer:middot
  - opens: ובראשי חדשיכם תקריבו עולה
    urn: urn:x-opensiddur:text:prayer:qorbanot/musaf/rosh_chodesh

  # -- Verse collages and passages, by function or incipit -------------------------------------
  - opens: ברכי נפשי את יהוה יהוה אלהי גדלת מאד
    leaf: The Morning Prayers / My Soul Bless
    urn: urn:x-opensiddur:text:bible:psalms/104
    note: "the whole psalm; the tallit's two verses before it are a part of it"
  - opens: למען תזכור את יום צאתך
