    urn: urn:x-opensiddur:text:prayer:hodu
    note: "1 Chronicles 16:8-36 and the verses after it"
  - opens: ויברך דויד את יהוה לעיני כל הקהל
    urn: urn:x-opensiddur:text:prayer:vayvarekh_david
