# Where each node of Sefaria's Siddur Ashkenaz schema sits, for the Metsudah versions: its
# siddur: URN (specs/SIDDUR_URN_SCHEME.md), scoped to the Metsudah Ashkenaz projects by
# @project. The schema is Sefaria's shared index, which many siddurim fill; the Metsudah
# versions fill only the weekday services, Friday night, Birkat HaMazon and (in the Hebrew
# supplement) Rosh Chodesh Hallel. Every other node is listed with no path and is skipped.
#
# The order is the schema's, which is the order of the services. Sefaria's grouping nodes
# (Preparatory Prayers, Post Amidah, ...) are divisions of their own.

