# Where each node of Sefaria's schema for the Shabbat Siddur sits in the book's running order:
# its siddur: URN (specs/SIDDUR_URN_SCHEME.md), scoped to the Metsudah projects by @project.
#
# A node is named by its English keys joined by " / ". An inner node names the division that
# holds its children; a leaf names the structure file that holds its text's transclusions and
# rubrics. A leaf Sefaria has left empty (Mah Yedidus, the Song of the Day, the preface to
# Pirkei Avos) is listed with no path and is skipped; any other node missing here is an error.
#
# Places the Weekday Siddur also has keep its names (berakhot/..., lifecycle/..., hallel,
# sefirat_haomer); places Birnbaum's Sabbath and festival volumes named are reused where they
# are the same place (shabbat/qabbalat_shabbat, shabbat/arvit, shabbat/leil_shabbat, ...).
# The Sabbath services serve the festivals too, as the book's own titles say.

