# Where each node of Sefaria's schema for the Weekday Siddur sits in the book's running order:
# its siddur: URN (specs/SIDDUR_URN_SCHEME.md), scoped to the Metsudah projects by @project.
#
# A node is named by its English keys joined by " / ". An inner node names the division that
# holds its children; a leaf names the structure file that holds its text's transclusions and
# rubrics. A leaf Sefaria has left empty (Hoshanos, the weekday Selichos) is listed with no
# path and is skipped; any other node missing here is an error.

