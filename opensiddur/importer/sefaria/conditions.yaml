    urn: urn:x-opensiddur:text:prayer:amidah/shalom/hamevarekh
    # where the Besefer Chayyim before it prints the custom's closing (עושה השלום) in parentheses:
    # said unless that closing was
    places: [urn:x-opensiddur:text:siddur:chol/arvit/shemoneh_esreh/shalom, urn:x-opensiddur:text:siddur:shabbat/arvit/shemoneh_esreh/shalom]
    when: {none: [{all: [{practice: {oseh-hashalom-aseret-ymei-tshuva: true}}, {holiday-aggregate: {aseret-ymei-tshuva: true}}]}]}
  - work: siddur_ashkenaz
    urn: urn:x-opensiddur:text:prayer:amidah/attah_chonantanu
    # in small type; the night after Shabbat or a festival (Birnbaum's arvit_chonantanu)
    when:
      any:
        - day-of-week: {hebrew-day: 1}
        - hebrew-date: {month: 7, day: 3}
        - hebrew-date: {month: 7, day: 11}
        - all:
            - none: [{israel: {is-israel: false}}]
            - any: [{hebrew-date: {month: 1, day: 16}}, {hebrew-date: {month: 1, day: 22}}, {hebrew-date: {month: 3, day: 7}},
                    {hebrew-date: {month: 7, day: 16}}, {hebrew-date: {month: 7, day: 23}}]
        - all:
            - israel: {is-israel: false}
            - any: [{hebrew-date: {month: 1, day: 17}}, {hebrew-date: {month: 1, day: 23}}, {hebrew-date: {month: 3, day: 8}},
                    {hebrew-date: {month: 7, day: 17}}, {hebrew-date: {month: 7, day: 24}}]
  - work: siddur_ashkenaz
    urn: urn:x-opensiddur:text:prayer:amidah/hodaah/modim_derabbanan
