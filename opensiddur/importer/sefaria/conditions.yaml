  - "^When the reading of the Torah is concluded"
  - "^On Rosh Chodesh the Chazzan recites the half-Kaddish"
  - "^On regular weekdays,? continue"
  - "^On Rosh Chodesh and on Chol HaMoed the Chazzan recites the Whole Kaddish"
