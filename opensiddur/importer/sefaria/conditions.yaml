# The conditions the Metsudah volumes print (see conditions.py). A rubric is matched against its
# English, whitespace collapsed; the first match wins. `section: true` lets a rubric before a
# heading govern the whole section to the next heading (the Kedushah), not only the next text.

# Conditions used more than once, as YAML anchors (the loader ignores this key). They follow
# Birnbaum's encodings (hasiddur_hashalem-birnbaum-1949-he), so that the two books agree.
definitions:
  # The days on which Tachanun is omitted (Birnbaum's list, with Pesach Sheini, which this rite
  # adds). Month 1 is Nisan; 12 and 13 are Adar (Rishon) and Adar Sheni.
  tachanun_omitted_days: &tachanun_omitted_days
    any:
      - holiday: {rosh-hodesh: true}
      - holiday: {hanukkah: true}
      - hebrew-date: {month: 12, day: [14, 15]}
      - hebrew-date: {month: 13, day: [14, 15]}
      - hebrew-date: {month: 1}
      - hebrew-date: {month: 2, day: 14}
      - holiday: {lag-baomer: true}
      - hebrew-date: {month: 3, day: [1, 8]}
      - holiday: {tisha-bav: true}
      - hebrew-date: {month: 5, day: 15}
      - hebrew-date: {month: 6, day: 29}
      - hebrew-date: {month: 7, day: [9, 23]}
      - all: [{hebrew-date: {month: 7, day: 24}}, {none: [{israel: {is-israel: true}}]}]
      - hebrew-date: {month: 11, day: 15}
  # ... and the occasions, as Birnbaum declares them, with a bridegroom present.
  tachanun_omitted: &tachanun_omitted
    any:
      - *tachanun_omitted_days
      - override: {omit-tahanun: true}
      - override: {house-of-mourning: true}
      - override: {brit-milah: true}
      - override: {wedding: true}
      - override: {sheva-brachot: true}
  # At Minchah Tachanun is also omitted on the eve of those days ("it is also omitted at the
  # preceding Mincha"), and on Fridays (Birnbaum's minchah_tachanun, with the eve of Pesach Sheini).
  minchah_tachanun_omitted_days: &minchah_tachanun_omitted_days
    any:
      - day-of-week: {hebrew-day: [6, 7]}
      - hebrew-date: {day: 29}
      - hebrew-date: {month: 2, day: [13, 14]}
      - hebrew-date: {month: 2, day: [17, 18]}
      - hebrew-date: {month: 5, day: [8, 9]}
      - hebrew-date: {month: 5, day: [14, 15]}
      - hebrew-date: {month: 9, day: [24, 30]}
      - hebrew-date: {month: 11, day: [14, 15]}
      - hebrew-date: {month: 12, day: [13, 15]}
      - hebrew-date: {month: 13, day: [13, 15]}
  tachanun_said: &tachanun_said
    none:
      - *tachanun_omitted
      - all: [{service-time: {minha: true}}, *minchah_tachanun_omitted_days]
  # The same at Minchah, written out for places that declare no service time.
  minchah_tachanun_said: &minchah_tachanun_said
    none: [*tachanun_omitted, *minchah_tachanun_omitted_days]
  monday_or_thursday: &monday_or_thursday
    any: [{day-of-week: {hebrew-day: 2}}, {day-of-week: {hebrew-day: 5}}]
  # A weekday on which the Torah is read, with a minyan (Birnbaum's torah_reading_day).
  torah_reading_day: &torah_reading_day
    none:
      - quorum: {minyan: false}
      - none:
          - any:
              - *monday_or_thursday
              - holiday: {rosh-hodesh: true}
              - holiday-aggregate: {chol-hamoed: true}
              - holiday: {hanukkah: true}
              - holiday: {purim-observed: true}
              - holiday-aggregate: {minor-fast: true}
              - holiday: {tzom-tammuz: true}
  shabbat_or_yom_tov: &shabbat_or_yom_tov
    any: [{holiday-aggregate: {shabbat: true}}, {holiday-aggregate: {yom-tov: true}}]
  elul_to_shemini_atzeret: &elul_to_shemini_atzeret
    any: [{hebrew-date: {month: 6}}, {hebrew-date: {month: 7, day: [1, 22]}}]
  parents_host: &parents_host
    any: [{meal-context: {father-is-host: true}}, {meal-context: {mother-is-host: true}}]
  # The reader's repetition, with a minyan (Birnbaum's weekday_qedushah).
  repetition: &repetition
    all: [{recitation: {repetition: true}}, {quorum: {minyan: true}}]
  # The reader says אלהינו ואלהי אבותינו ברכנו when no kohanim bless.
  reader_blesses: &reader_blesses
    all: [{quorum: {minyan: true}}, {recitation: {repetition: true}}, {none: [{practice: {birkat-kohanim: true}}]}]
  ten_days: &ten_days
    holiday-aggregate: {aseret-ymei-tshuva: true}
  public_fast: &public_fast
    any: [{holiday-aggregate: {minor-fast: true}}, {holiday: {tzom-tammuz: true}}]
  kohanim_bless: &kohanim_bless
    all: [{quorum: {minyan: true}}, {recitation: {repetition: true}}, {practice: {birkat-kohanim: true}}]

rubrics:
  # -- Seasons ----------------------------------------------------------------------------------
  - match: "^\\(?\\*?Between Rosh Hashanah and Yom Kippur,? substitute\\b"
    # a substitute for the words before it, where the two end alike (הָאֵל הַקָּדוֹשׁ, then
    # "substitute:" הַמֶּלֶךְ הַקָּדוֹשׁ): those are said otherwise
    when: {holiday-aggregate: {aseret-ymei-tshuva: true}}
    instead_of_previous: true
  - match: "^\\(?\\*?During the Ten Days of Penitence(,)? (add|say|continue here)\\b|^\\*?During the Ten Days of Penitence:|^\\(?\\*?Between Rosh Hashanah and Yom Kippur,? (add|substitute)\\b"
    when: {holiday-aggregate: {aseret-ymei-tshuva: true}}
  - match: "^The following five prayers are said during the Ten Days of Penitence"
    when: {holiday-aggregate: {aseret-ymei-tshuva: true}}
  - match: "^\\(?From ?the ?Musaf ?of the first day of Pesach until ?the ?Musaf ?of Shemini Atzeres|^\\(?On Pesach,? \\(?except (on the first day of Pesach in the silent Amidah\\)|for Shacharis of the first day),? (on )?Shavuos and Sukkos"
    # (Sefaria's English sometimes runs "theMusafof" together)
    when: {holiday-aggregate: {geshem: false}}
  - match: "^\\(?From ?the ?Musaf ?of Shemini Atzeres until ?the ?Musaf ?of the first day of Pesach|^\\(?From Mincha of Shemini Atzeres until after Shacharis on the first day of Pesach|^\\(?On Shemini Atzeres, Simchas Torah and on the first day of Pesach"
    when: {holiday-aggregate: {geshem: true}}
  - match: "^From the evening service \\[Maariv\\] on December 4"
    when: {holiday-aggregate: {tal-umatar: true}}
  - match: "^From the first (day|say) of Pesach until the evening service \\[Maariv\\] on December 4"
    when: {holiday-aggregate: {tal-umatar: false}}
  - match: "^The following psalm \\(27\\) is recited|^The following is recited here by some congregations from the first day of Elul"
    when: *elul_to_shemini_atzeret
  - match: "^During the Ten Days of Penitence, continue at the asterisk|^Between Rosh Hashanah and Yom Kippur (the Chazzan )?continues? at the asterisk"
    # the ordinary closing it skips (הָאֵל הַקָּדוֹשׁ), to the rubric at the asterisk
    when: {none: [{holiday-aggregate: {aseret-ymei-tshuva: true}}]}
  - match: "^During the Ten Days of Penitence, Avinu Malkeinu is recited here"
    when: {any: [{holiday-aggregate: {aseret-ymei-tshuva: true}}, {holiday-aggregate: {minor-fast: true}}, {holiday: {tzom-tammuz: true}}]}

  # -- Days of the month and festivals ---------------------------------------------------------
  - match: "On Rosh Chodesh and on Chol HaMoed,? the following prayer is added"
    when: {any: [{holiday: {rosh-hodesh: true}}, {holiday-aggregate: {chol-hamoed: true}}]}
  - match: "^On Rosh Chodesh and Yom Tov,? add:"
    when: {any: [{holiday: {rosh-hodesh: true}}, {holiday-aggregate: {yom-tov: true}}]}
  - match: "^On Rosh Chodesh (add|say):"
    when: {holiday: {rosh-hodesh: true}}
  - match: "^The following psalm \\(104\\) is recited in many synagogues on Rosh Chodesh"
    when: {holiday: {rosh-hodesh: true}}
  - match: "^As a segulah for long life, some people say the following verse on Rosh Chodesh"
    when: {holiday: {rosh-hodesh: true}}
  - match: "^On Rosh Chodesh and on the last six days of Pesach omit the following paragraph"
    when: {none: [{holiday: {rosh-hodesh: true}}, {holiday: {pesah: [3, 8]}}]}
  - match: "^\\(?On Chanukah and Purim (add|the following prayer is added)"
    when: {any: [{holiday: {hanukkah: true}}, {holiday: {purim-observed: true}}]}
  - match: "^\\(?On (Shabbos )?Chanukah( add)?:|^\\(?On (Shabbos )?Chanukah the following prayer is added"
    when: {holiday: {hanukkah: true}}
  - match: "^The following blessing is said only on the first evening:"
    when: {holiday: {hanukkah: 1}}
  - match: "^On Purim:"
    when: {holiday: {purim-observed: true}}
  - match: "^\\(?On Shabbos and Yom Tov say:"
    # the festival Haftarah's closing, said only on Yom Tov: "Shabbos and Yom Tov" is a Yom Tov
    # (or Chol Hamoed) on Shabbos; the closing before it (... וְהַזְּמַנִּים) is said otherwise
    leaves: ["Reading of the Torah / Berachos for the Haftarah"]
    when: {holiday-aggregate: {shabbat: true}}
    instead_of_previous: true
  - match: "^\\(?On Shabbos and Yom Tov say:"
    when: {any: [{holiday-aggregate: {shabbat: true}}, {holiday-aggregate: {yom-tov: true}}]}
    # Grace's מִגְדּוֹל: the phrase before, where it ends alike (מַגְדִּיל ... מַלְכּוֹ), is said
    # otherwise
    through: "מִגְדּוֹל יְשׁוּעוֹת מַלְכּוֹ"
    instead_of_previous: true
    # no verse is marked: neither is quoted exactly (the user's decision); the editors note both
    source: "II Samuel 22:51."
    otherwise_source: "Psalm 18:51."
  - match: "^\\(?On Shabbos,? (add|say):|^On Shabbos conclude with this berachah|^On Shabbos, the Chazzan begins here|^On Shabbos, before Borechu, the following selection from the Zohar is said|^The following three prayers are said only on Sabbath"
    when: {holiday-aggregate: {shabbat: true}}
  - match: "^On (the )?Yom Tov say:|^On Yom Tov conclude with this berachah|^On Yom Tov, the Chazzan begins here"
    when: {holiday-aggregate: {yom-tov: true}}
  - match: "^On Rosh Hash(o|a)n(ah?|oh?) say:"
    when: {holiday: {rosh-hashana: true}}
  - match: "^On Sukkos say:"
    # Grace's הרחמן for Sukkot, one sentence: the הרחמן after it is said every day
    when: {holiday: {sukkot: true}}
    through: "אֶת סֻכַּת דָּוִד הַנּוֹפָֽלֶת"
  - match: "^On Sukkos:"
    when: {holiday: {sukkot: true}}
  - match: "^On Pesach:"
    when: {holiday: {pesah: true}}

  # -- The Sabbath and the festivals (the Shabbat siddur) ----------------------------------------
  - match: "^On Pesach, Shavuos and Sukkos,? say:"
    # Vayedaber Moshe after Veshamru: on the festivals' days of Yom Tov, Shemini Atzeret among
    # them, not on Chol Hamoed (as Birnbaum encodes it)
    when: {all: [{holiday-aggregate: {yom-tov: true}}, {any: [{holiday: {pesah: true}}, {holiday: {shavuot: true}}, {holiday: {sukkot: true}}, {holiday: {shmini-atzeret: true}}]}]}
  - match: "^On Shavuos:"
    when: {holiday: {shavuot: true}}
  - match: "^On Shemini Atseres and Simchas Torah:"
    when: {holiday: {shmini-atzeret: true}}
  - match: "^When Rosh Chodesh occurs on Shabbos:"
    when: {all: [{holiday-aggregate: {shabbat: true}}, {holiday: {rosh-hodesh: true}}]}
  - match: "^When Yom Tov occurs on Shabbos, begin here"
    when: {all: [{holiday-aggregate: {shabbat: true}}, {holiday-aggregate: {yom-tov: true}}]}
  - match: "^When Yom Tov occurs on (a )?[Ww]eekdays?(,)? (say|continue)\\b"
    when: {all: [{holiday-aggregate: {yom-tov: true}}, {none: [{holiday-aggregate: {shabbat: true}}]}]}
  - match: "^When the Festival falls on Motzoei Shabbos say:|^\\(?When Yom Tov occurs at the conclusion of Shabbos, the following two berachos are said"
    when: {all: [{holiday-aggregate: {yom-tov: true}}, {holiday-aggregate: {motzaei-shabbat: true}}]}
    # as Birnbaum's festival Kiddush conditions its Havdalah
  - match: "^On Yom Tov and Chol Hamoed skip to"
    # the stanzas before the one named, which the festivals leave out
    when: {none: [{holiday-aggregate: {yom-tov: true}}, {holiday-aggregate: {chol-hamoed: true}}]}
  - match: "^On weekdays say:"
    when: {none: [*shabbat_or_yom_tov]}
    through: "מַגְדִּיל יְשׁוּעוֹת מַלְכּוֹ"  # (Grace: what follows is said every day)
    source: "Psalm 18:51."
  - match: "^On a regular Shabbos the Chazzan recites the following Kaddish"
    when: {all: [{holiday-aggregate: {shabbat: true}}, {none: [{holiday-aggregate: {yom-tov: true}}, {holiday-aggregate: {chol-hamoed: true}}, {holiday: {rosh-hodesh: true}}]}]}
  - match: "^The following paragraph is omitted on occasions when the Tachanun prayer would be omitted on weekdays"
    when: {none: [*tachanun_omitted_days]}
  - match: "^\\(?On the last two nights of Pesach the following berachah is omitted"
    when: {none: [{holiday: {pesah: [7, 8]}}]}
  - match: "^On Fast-days the berachos end here"
    # the blessings after the Haftarah that follow, which a fast day leaves out
    when: {none: [{holiday-aggregate: {minor-fast: true}}, {holiday: {tisha-bav: true}}]}
  - match: "^During Maariv the following is said by some in place of"
    when: {service-time: {maariv: true}}

  # -- Fasts ------------------------------------------------------------------------------------
  - match: "^During Mincha services on the Ninth of Av"
    when: {all: [{holiday: {tisha-bav: true}}, {service-time: {minha: true}}]}
  - match: "^On Fast days during Mincha"
    when: {all: [{any: [{holiday-aggregate: {minor-fast: true}}, {holiday: {tisha-bav: true}}]}, {service-time: {minha: true}}]}
  - match: "^On public fast-days, say:|^The following five prayers are said on public fast-days"
    when: {holiday-aggregate: {minor-fast: true}}
  - match: "^Birkas Kohanim is said by the Chazzan on public fast-days"
    when: {any: [{holiday-aggregate: {minor-fast: true}}, {holiday: {tisha-bav: true}}]}

  # -- Days of the week -------------------------------------------------------------------------
  - match: "^On Sunday:"
    when: {day-of-week: {hebrew-day: 1}}
    until: "^\\(Deliver us"
    until_included: true
  - match: "^On Monday:"
    when: {day-of-week: {hebrew-day: 2}}
    until: "^\\(Deliver us"
    until_included: true
  - match: "^On Tuesday:"
    when: {day-of-week: {hebrew-day: 3}}
    until: "^\\(Deliver us"
    until_included: true
  - match: "^On Wednesday:"
    when: {day-of-week: {hebrew-day: 4}}
    until: "^\\(Deliver us"
    until_included: true
  - match: "^On Thursday:"
    when: {day-of-week: {hebrew-day: 5}}
    until: "^\\(Deliver us"
    until_included: true
  - match: "^On Friday:"
    when: {day-of-week: {hebrew-day: 6}}
    until: "^\\(Deliver us"
    until_included: true

  # -- Tachanun, and the days the Torah is read --------------------------------------------------
  - match: "^The following prayers are added on Mondays and Thursday"
    when: {all: [*monday_or_thursday, *tachanun_said]}
  - match: "^On those Mondays and Thursdays when Tachanun is said"
    when: {all: [*monday_or_thursday, *tachanun_said]}
  - match: "^Tachanun is also omitted"
    # the book's list of days is printed garbled in the rubric before; Birnbaum's is used
    when: *tachanun_said
    until: "^The Chazzan recites the following Kaddish"
  - match: "^On a day when Tachanun is not said, the following paragraph is omitted|^On days in which Tachanun is not said, \"A prayer of David,\" is omitted"
    when: *tachanun_said
  # In the house of a mourner, where Tachanun is never said: the days it would be, and not.
  - match: "^On days when Tachanun is said:"
    when: {none: [*tachanun_omitted_days]}
  - match: "^On weekdays when Tachanun is not said, the following is said in the house of a mourner"
    when: *tachanun_omitted_days
  - match: "^The following paragraph is said on Mondays and Thursdays except on Rosh Chodesh"
    when:
      all:
        - *monday_or_thursday
        - none:
            - holiday: {rosh-hodesh: true}
            - hebrew-date: {month: 1, day: 14}
            - holiday: {tisha-bav: true}
            - holiday: {hanukkah: true}
            - hebrew-date: {month: 12, day: [14, 15]}
            - hebrew-date: {month: 13, day: [14, 15]}
            - hebrew-date: {month: 7, day: 9}
            - override: {house-of-mourning: true}
  - match: "^On Mondays, Thursdays and other days when the Torah is read"
    when: *torah_reading_day
  - match: "^Psalm 20 is omitted on the following days"
    when:
      none:
        - holiday: {rosh-hodesh: true}
        - hebrew-date: {month: 7, day: [9, 30]}
        - holiday: {hanukkah: true}
        - hebrew-date: {month: 12, day: [14, 15]}
        - hebrew-date: {month: 13, day: [14, 15]}
        - hebrew-date: {month: 1}
        - holiday-aggregate: {chol-hamoed: true}
        - holiday: {tisha-bav: true}
        - override: {house-of-mourning: true}
        - hebrew-date: {month: 2, day: 14}
        - holiday: {lag-baomer: true}
        - hebrew-date: {month: 3, day: [1, 12]}
        - hebrew-date: {month: 5, day: 15}
        - hebrew-date: {month: 11, day: 15}
        - override: {brit-milah: true}
        - override: {wedding: true}
        - override: {sheva-brachot: true}
  - match: "^On regular weekdays the Chazzan recites the following Kaddish"
    when: {none: [{holiday: {rosh-hodesh: true}}, {holiday-aggregate: {chol-hamoed: true}}]}
    section: true  # the whole Kaddish, a text of several parts
  - match: "^The following Psalm is omitted on Shabbat, Festivals, the day before Pesach"
    # Mizmor Letodah: Birnbaum's days, with Shabbat and Yom Tov, which this rite names
    when:
      none:
        - *shabbat_or_yom_tov
        - hebrew-date: {month: 1, day: 14}
        - all: [{holiday-aggregate: {chol-hamoed: true}}, {holiday: {pesah: true}}]
        - hebrew-date: {month: 7, day: 9}
  - match: "^On Tishah B'Av and on Yom Kippur this berachah is omitted"
    when: {none: [{holiday: {tisha-bav: true}}, {holiday: {yom-kippur: true}}]}
  - match: "^The following prayer is omitted on Shabbos and Yom Tov"
    when: {none: [*shabbat_or_yom_tov]}

  # -- Who is praying, and how ------------------------------------------------------------------
  - match: "^\\(?When the Chazzan repeats the Shemoneh Esrei(,| during Shacharis,) the Kedushah is said here"
    when: {all: [{recitation: {repetition: true}}, {quorum: {minyan: true}}]}
    section: true
  - match: "^During the silent Shemoneh Esrei, continue here:"
    when: {recitation: {silent: true}}
  - match: "^The following three words should be said when praying without a minyan:|^When one is praying without a minyan, continue with the following"
    when: {quorum: {minyan: false}}
  - match: "^If there are at least 10 men, add:"
    when: {quorum: {minyan: true}}
  - match: "^If you are taking the lulav for the first time on Sukkos"
    when: {practice: {lulav-first-use: true}}
  - match: "^After the reading of the Megillah, if there is a minyan"
    when: {quorum: {minyan: true}}
  - match: "^\\(When the Chazzan repeats the Shemoneh Esrei and says, .Who returns His Divine Presence to Zion"
    # מודים דרבנן, which a text may print inside it, to its closing
    when: {all: [{recitation: {repetition: true}}, {quorum: {minyan: true}}]}
    through: "בָּרוּךְ אֵל הַהוֹדָאוֹת"
  - match: "^When praying silently, continue .You are holy.* the Kedushah is said here"
    when: {all: [{recitation: {repetition: true}}, {quorum: {minyan: true}}]}
    section: true
  - match: "^After Birkas Kohanim the congregation says:"
    when: *kohanim_bless
  - match: "^When Kohanim are present, th?e Birkas Kohanim( \\(page 000\\))? is recited here, If no Kohanim are present"
    when: {all: [{quorum: {minyan: true}}, {recitation: {repetition: true}}, {none: [{practice: {birkat-kohanim: true}}]}]}
  - match: "^The following blessing is said by the father of a Bar Mitzvah"
    when: {person: {bar-mitzvah-father: true}}
  - match: "^A woman says:"
    when: {person: {gender: female}}
    instead_of_previous: true

  # -- The meal -----------------------------------------------------------------------------------
  - match: "^When three or more males,? aged 13 or older eat together"
    when: {meal-context: {zimmun: true}}
  - match: "^Psalm 137 is recited before Birkas Hamazon on weekdays"
    when: {none: [*shabbat_or_yom_tov, {override: {wedding: true}}, {override: {sheva-brachot: true}}, {override: {brit-milah: true}}]}
  - match: "^Psalm 126 is recited on Shabbos, Yom Tov and other festive occasions"
    when: {any: [*shabbat_or_yom_tov, {override: {wedding: true}}, {override: {sheva-brachot: true}}, {override: {brit-milah: true}}]}
  # As Birnbaum: the host blessings are a guest's; the three are exclusive.
  - match: "^When eating at your parents' table"
    when: {all: [{meal-context: {guest: true}}, *parents_host]}
  - match: "^When eating at your own table"
    when: {none: [{meal-context: {guest: true}}]}
  - match: "^A guest says:"
    when: {all: [{meal-context: {guest: true}}, {none: [*parents_host]}]}

  # -- What was eaten (מעין שלש) ----------------------------------------------------------------
  - match: "^The following blessing is said after eating cooked or baked foods prepared from any of the five species of grain|^After food prepared from the five grains, say:"
    when: {meal-context: {meein-shalosh-food: cake}}
  - match: "^After (drinking )?wine( say)?:"
    when: {meal-context: {meein-shalosh-food: wine}}
  - match: "^After (eating )?grapes, figs, (olives, dates or pomegranates|olives, dates, pomegranates)"
    when: {meal-context: {meein-shalosh-food: fruit}}
  - match: "^After (eating )?grain foods and (drinking )?wine"
    when: {meal-context: {meein-shalosh-food: cake_wine}}

labels:
  - label: 'לר"ח'
    when: {holiday: {rosh-hodesh: true}}
  - label: 'לפסח'
    when: {holiday: {pesah: true}}
  - label: 'לסוכות'
    when: {holiday: {sukkot: true}}
  - label: 'לר"ה'
    when: {holiday: {rosh-hashana: true}}
  - label: 'לש"ע וש"ת'
    when: {holiday: {shmini-atzeret: true}}
  - label: 'לשמ"ע וש"ת'
    when: {holiday: {shmini-atzeret: true}}
  - label: 'לשבועות'
    when: {holiday: {shavuot: true}}
  - label: 'לשבת'
    when: {holiday-aggregate: {shabbat: true}}
  - label: 'בשנת העיבור עד חדש ניסן'
    when: {hebrew-date: {leap-year: true, month: [7, 13]}}
  # The Ashkenaz siddur's labels, at the head of the paragraph they govern
  - label: 'בחורף'
    when: {holiday-aggregate: {geshem: true}}
  - label: 'בקיץ'
    when: {holiday-aggregate: {geshem: false}}
  - label: 'בימות הגשמים'
    when: {holiday-aggregate: {tal-umatar: true}}
  - label: 'בימות החמה'
    when: {holiday-aggregate: {tal-umatar: false}}
  - label: 'בעשי"ת יסיים'
    when: {holiday-aggregate: {aseret-ymei-tshuva: true}}
    ending: true
  - label: 'בעשי"ת מסיים'
    when: {holiday-aggregate: {aseret-ymei-tshuva: true}}
    ending: true
  - label: 'נשים אומרות'
    # שעשני כרצונו, said by a woman instead of שלא עשני אשה (in parentheses)
    when: {person: {gender: female}}
    instead_of_previous: true
  - label: 'לתענית ציבור'
    # Sim Shalom at Minchah, which the fast days' Minchah says instead of Shalom Rav
    instead_of_previous: true
    when: {any: [{holiday-aggregate: {minor-fast: true}}, {holiday: {tisha-bav: true}}]}
  - label: 'בראש חדש ובחול המועד אומרים זה'
    # Ya'aleh Veyavo in the Amidah
    when: {any: [{holiday: {rosh-hodesh: true}}, {holiday-aggregate: {chol-hamoed: true}}]}
  - label: 'בראש חודש ובחול המועד אומרים כאן "יעלה ויבא"'
    # ... and in Birkat Hamazon, which the English gives for Yom Tov as well; through Zokhrenu,
    # to the rubric for one who forgot it
    until: "^If you forgot to say"
    when: {any: [{holiday: {rosh-hodesh: true}}, {holiday-aggregate: {chol-hamoed: true}}, {holiday-aggregate: {yom-tov: true}}]}
  - label: 'שלושה שאכלו כאחד חייבין בזימון, וכך מזמנין'
    # the invitation and its responses, to the first blessing
    when: {meal-context: {zimmun: true}}
    until: "FIRST BERACHA"
  - label: 'בשבת מוסיפים'
    # Retzeh in Birkat Hamazon
    when: {holiday-aggregate: {shabbat: true}}
  - label: 'בשבועות'
    when: {holiday: {shavuot: true}}
  - label: 'בחנוכה ופורים אומרים כאן ועל הנסים'
    when: {any: [{holiday: {hanukkah: true}}, {holiday: {purim-observed: true}}]}
  - label: "בחנוכה ופורים אומרים כאן על הניסים. ואם לא אמרו אין מחזירין אותו. ומכל מקום יוכל לאמרו בתוך שאר הרחמן. ויאמר הָרַחֲמָן הוּא יַעֲשֶׂה־לָּנוּ נִסִים וְנִפְלָאוֹת כְּמוֹ שֶׁעָשָׂה לַאֲבוֹתֵינוּ בַּיָּמִים הָהֵם בַּזְּמַן הַזֶּה וכו' בִּימֵי מַתִּתְיָהוּ וכו' או בִּימֵי מָרְדְּכַי וכו'."
    # Al HaNissim in Birkat Hamazon (Siddur Ashkenaz): the whole instruction is the label
    when: {any: [{holiday: {hanukkah: true}}, {holiday: {purim-observed: true}}]}
  - label: 'בחול קודם ברכת המזון אומרים'
    # Psalm 137 on weekdays, Psalm 126 on Sabbaths and festivals, as Birnbaum conditions them
    when: {none: [{day-of-week: {hebrew-day: 7}}, {any: [{holiday: {pesah: true}}, {holiday: {shavuot: true}}, {holiday: {sukkot: true}}, {holiday: {shmini-atzeret: true}}]}, {holiday: {rosh-hashana: true}}]}
  - label: 'בשבת קודם ברכת המזון אומרים'
    when: {any: [{day-of-week: {hebrew-day: 7}}, {any: [{holiday: {pesah: true}}, {holiday: {shavuot: true}}, {holiday: {sukkot: true}}, {holiday: {shmini-atzeret: true}}]}, {holiday: {rosh-hashana: true}}]}
  - label: 'ילדים האוכלים ביו"כ'
    when: {holiday: {yom-kippur: true}}
  - label: 'יחיד אומר'
    when: {quorum: {minyan: false}}
  - label: 'בראש חודש ובחוה"מ פסח מדלגין'
    # "skip on Rosh Chodesh and Chol Hamoed Pesach": the words are said only in the full Hallel
    # (as Birnbaum encodes it), which the last days of Pesach do not say either
    when: {hallel: {full: true}}
    instruction: true

inline:
  - label: 'בעשי"ת'
    when: {holiday-aggregate: {aseret-ymei-tshuva: true}}
  - label: 'בעשרה'
    when: {quorum: {minyan: true}}
  - label: 'בשנת העיבור עד חדש ניסן'
    when: {hebrew-date: {leap-year: true, month: [7, 13]}}
  - label: 'בשבת וביו"ט אומר'
    when: *shabbat_or_yom_tov

replacements:
  - alternative: 'הַשָּׁלוֹם'
    replaces: 'שָׁלוֹם'
  - alternative: 'וּלְעֵֽלָּא מִכָּל'
    replaces: 'מִן כָּל'
  - alternative: 'לְעֵֽלָּא לְעֵֽלָּא מִכָּל'
    # Siddur Ashkenaz prints the first לעלא inside the alternative too
    replaces: 'לְעֵֽלָּא מִן כָּל'
  - alternative: 'מִגְדּוֹל יְשׁוּעוֹת מַלְכּוֹ'
    replaces: 'מַגְדִּיל יְשׁוּעוֹת מַלְכּוֹ'
    source: "II Samuel 22:51."
    replaces_source: "Psalm 18:51."
  - alternative: 'הַמֶּלֶךְ הַקָּדוֹשׁ'
    # Siddur Ashkenaz's Magen Avot prints it after הָאֵל הַקָּדוֹשׁ in small type, unlabelled
    replaces: 'הָאֵל הַקָּדוֹשׁ'
    when: {holiday-aggregate: {aseret-ymei-tshuva: true}}
  - alternative: 'בָּרוּךְ אַתָּה יְהֹוָה עֹשֶׂה הַשָּׁלוֹם'
    # Siddur Ashkenaz's Maariv Besefer Chayyim, in parentheses and untranslated: the closing of
    # those whose custom it is, said in the Ten Days instead of המברך (gated in `texts`). Birnbaum
    # says it as the Ten Days' closing (prayer:amidah/shalom/besefer_chayyim); Metsudah, only by
    # that custom. The Metsudah English leaves it untranslated: the English is ours (the user's
    # decision), so that the English, too, has a closing where המברך is not said.
    when: {all: [{practice: {oseh-hashalom-aseret-ymei-tshuva: true}}, {holiday-aggregate: {aseret-ymei-tshuva: true}}]}
    english: "Blessed are You, Adonoy, Who makes peace."
    english_note: "Translated by the editors; the Metsudah English does not translate this closing."

