name: Validate projects

# Reusable workflow (opensiddur-processor#94): validates a PR to opensiddur-projects by running this
# repository's schema and referential-integrity validators against it. Called from
# opensiddur-projects/.github/workflows/validate.yml.
#
# No `paths:` filter and every stage below always runs, even when the caller's event touches
# no XML -- a required status check that can be skipped blocks a PR forever, so this job must
# always run and report (opensiddur-processor#94, design question 5).

on:
  workflow_call:
    inputs:
      opensiddur_processor_ref:
        description: >
          Ref (branch, tag, or SHA) of opensiddur-processor to check out the validators from.
          Decoupled from this workflow file's own version, which the caller always pins with
          `uses: opensiddur/opensiddur-processor/.github/workflows/validate-projects.yml@main` --
          this input lets a manual run exercise a different branch of the validator code
          without changing which copy of the workflow definition runs. Empty (the default)
          means auto-detect: a pull_request whose head branch also exists in opensiddur-processor
          (a companion PR) is validated against that branch, everything else against main.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Install Jing (RelaxNG validator)
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --no-install-suggests -y jing

      - name: Checkout opensiddur-projects (the PR)
        uses: actions/checkout@v5
        with:
          # Full history: the affected-projects diff below needs the PR's base branch.
          fetch-depth: 0
          path: projects

      # A change that spans both repositories (new registry entries, schema or validator
      # changes, plus the project XML that needs them) is a pair of PRs on the same branch
      # name. Validating the projects half against opensiddur-processor main would fail until the code
      # half merges, so a PR's head branch is looked up in opensiddur-processor and used if it exists.
      # Once the companion PR merges and its branch is deleted, a re-run falls back to main.
      - name: Resolve opensiddur-processor ref
        id: processor_ref
        env:
          INPUT_REF: ${{ inputs.opensiddur_processor_ref }}
          # Same-repository PRs only: a fork's branch name is not a claim to a companion.
          HEAD_REF: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF}"
          if [ -z "${ref}" ]; then
            ref=main
            if [ -n "${HEAD_REF}" ] && git ls-remote --exit-code --heads \
                https://github.com/opensiddur/opensiddur-processor.git "refs/heads/${HEAD_REF}" >/dev/null; then
              ref="${HEAD_REF}"
            fi
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "opensiddur-processor ref: ${ref}"
          if [ "${ref}" != main ]; then
            msg="Validated against opensiddur-processor ${ref}, not main. Merge the companion opensiddur-processor PR first, then re-run this check before merging."
            echo "::warning title=Companion opensiddur-processor ref::${msg}"
            echo "${msg}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout opensiddur-processor validators (${{ steps.processor_ref.outputs.ref }})
        uses: actions/checkout@v5
        with:
          repository: opensiddur/opensiddur-processor
          ref: ${{ steps.processor_ref.outputs.ref }}
          path: opensiddur-processor

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: opensiddur-processor
        run: uv sync --all-groups

      - name: Cache built schema
        uses: actions/cache@v6
        with:
          path: |
            opensiddur-processor/schema/*.relaxng
            opensiddur-processor/schema/*.schematron
            opensiddur-processor/schema/*.xslt
          key: schema-${{ steps.processor_ref.outputs.ref }}-${{ hashFiles('opensiddur-processor/schema/jlptei.odd.xml') }}

      - name: Build schema
        working-directory: opensiddur-processor
        run: bash scripts/build-schema.sh

      - name: Compute affected projects
        id: scope
        working-directory: projects
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_REF}" ]; then
            git fetch origin "${BASE_REF}"
            changed=$(git diff --name-only --diff-filter=d "origin/${BASE_REF}...HEAD" -- 'project/**/*.xml' || true)
            affected=$(printf '%s\n' "${changed}" | awk -F/ 'NF>=2 {print $2}' | sort -u)
          else
            # workflow_dispatch has no base branch: validate every project.
            affected=""
          fi
          project_args=""
          for p in ${affected}; do
            project_args="${project_args} --project ${p}"
          done
          # The list goes in a file, not an environment variable: one variable may hold at most
          # 128 KB, which a bulk import's few thousand project names exceed.
          printf '%s\n' "${affected}" > "$RUNNER_TEMP/affected_projects.txt"
          echo "project_args=${project_args}" >> "$GITHUB_OUTPUT"
          echo "Affected projects: ${affected:-<all>}"

      # Schema-validation results are cached between runs so a file is revalidated only when
      # its content or the schema changed. The cache records the content hashes of files that
      # passed, stamped with a fingerprint of the built schema (comments stripped -- the build
      # embeds a timestamp) and the validator code; a mismatched stamp revalidates everything,
      # so restore-keys never hands one schema's results to another. Failing files are never
      # recorded, so their errors are reported on every run, which also makes saving after a
      # failed validation safe. Checks across files (the URN steps below) are not cached. Like
      # the reference database, the cache belongs to the caller (opensiddur-projects).
      - name: Restore the schema-validation cache
        id: schema_cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/schema-validation.json
          key: schemaval-${{ hashFiles('opensiddur-processor/schema/jlptei.odd.xml', 'opensiddur-processor/opensiddur/exporter/validate_schema.py', 'opensiddur-processor/opensiddur/importer/util/validation.py') }}-${{ hashFiles('projects/project/**/*.xml') }}
          restore-keys: schemaval-${{ hashFiles('opensiddur-processor/schema/jlptei.odd.xml', 'opensiddur-processor/opensiddur/exporter/validate_schema.py', 'opensiddur-processor/opensiddur/importer/util/validation.py') }}-

      - name: Validate XML against the schema
        id: schema
        continue-on-error: true
        working-directory: opensiddur-processor
        run: |
          uv run python -m opensiddur.exporter.validate_schema \
            --project-directory "$GITHUB_WORKSPACE/projects/project" \
            --repo-root "$GITHUB_WORKSPACE/projects" \
            --github-annotations \
            --cache "$RUNNER_TEMP/schema-validation.json" \
            ${{ steps.scope.outputs.project_args }}

      - name: Save the schema-validation cache
        if: always() && steps.schema_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/schema-validation.json
          key: ${{ steps.schema_cache.outputs.cache-primary-key }}

      # The reference database is cached between runs so a PR re-indexes only the files it
      # changed (opensiddur-processor#165). refdb decides what to re-index by content hash, not mtime,
      # so the fresh checkout's mtimes don't matter. The key's first part is the indexing code:
      # refdb also stamps the database with a hash of that file's code (comments and docstrings
      # left out) and rebuilds on a mismatch, so restore-keys never hands one version's
      # database to another. The cache belongs to the
      # caller (opensiddur-projects); PRs restore from the one its `main` runs keep warm.
      # Restore and save are separate steps so the database is saved even when a later
      # validation step fails the job.
      - name: Restore the reference database cache
        id: refdb_cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/reference.db
          key: refdb-${{ hashFiles('opensiddur-processor/opensiddur/exporter/refdb.py') }}-${{ hashFiles('projects/project/**/*.xml') }}
          restore-keys: refdb-${{ hashFiles('opensiddur-processor/opensiddur/exporter/refdb.py') }}-

      - name: Build the reference database
        working-directory: opensiddur-processor
        run: |
          uv run python -m opensiddur.exporter.refdb \
            --project-directory "$GITHUB_WORKSPACE/projects/project" \
            --reference-db "$RUNNER_TEMP/reference.db"

      - name: Save the reference database cache
        if: steps.refdb_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/reference.db
          key: ${{ steps.refdb_cache.outputs.cache-primary-key }}

      - name: Validate URN reference resolution
        id: urn_references
        if: always()
        continue-on-error: true
        working-directory: opensiddur-processor
        run: |
          set -uo pipefail
          projects=$(cat "$RUNNER_TEMP/affected_projects.txt" 2>/dev/null || true)
          if [ -z "${projects}" ]; then
            projects=$(ls "$GITHUB_WORKSPACE/projects/project")
          fi
          existing=()
          for p in ${projects}; do
            if [ -d "$GITHUB_WORKSPACE/projects/project/$p" ]; then
              existing+=("$p")
            fi
          done
          if [ "${#existing[@]}" -eq 0 ]; then
            exit 0
          fi
          # One process for all of them: starting one per project takes hours for thousands.
          uv run python -m opensiddur.exporter.validate_urn_references "${existing[@]}" \
            --project-directory "$GITHUB_WORKSPACE/projects/project" \
            --reference-db "$RUNNER_TEMP/reference.db"

      - name: Validate the URN registry (repo-wide)
        id: urn_registry
        if: always()
        continue-on-error: true
        working-directory: opensiddur-processor
        run: |
          uv run python -m opensiddur.common.urn_registry --check \
            --project-directory "$GITHUB_WORKSPACE/projects/project" \
            --reference-db "$RUNNER_TEMP/reference.db"

      - name: Validate versification agreement (repo-wide)
        id: versification
        if: always()
        continue-on-error: true
        working-directory: opensiddur-processor
        run: |
          uv run python -m opensiddur.exporter.validate_versification \
            --project-directory "$GITHUB_WORKSPACE/projects/project"

      # Every j:declare, j:conditional and j:condition against the settings registry
      # (opensiddur/exporter/features.yaml): an unregistered opensiddur: type or feature, or a
      # value of the wrong kind. Repo-wide, because it is cheap: it reads each file once and
      # needs neither the schema nor the reference database.
      - name: Validate settings against the registry (repo-wide)
        id: features
        if: always()
        continue-on-error: true
        working-directory: opensiddur-processor
        run: |
          uv run python -m opensiddur.exporter.validate_features \
            --project-directory "$GITHUB_WORKSPACE/projects/project"

      # Project, settings, file and URN names, and their spelling (specs/NAMING_SCHEME.md).
      - name: Validate names
        id: names
        if: always()
        continue-on-error: true
        working-directory: opensiddur-processor
        run: |
          uv run python -m opensiddur.common.validate_names --check \
            --project-directory "$GITHUB_WORKSPACE/projects/project" \
            --settings-directory "$GITHUB_WORKSPACE/projects/settings"

      # Settings files (opensiddur-projects/settings/<book>/<variant>.yaml) are built into printed
      # books at release (release-projects.yml); a broken one should fail here, not at release.
      # --check verifies each is in place, parses, matches the schema, names a project and file
      # that exist, and that every font chain it is typeset with has an installed font. The
      # fonts installed here are the ones the release build installs, so the check means the
      # same thing in both places.
      - name: Install fonts for the settings check
        if: always()
        run: |
          sudo apt-get install --no-install-recommends --no-install-suggests -y \
            culmus fonts-linuxlibertine fonts-sil-ezra fonts-freefont-otf
          fc-cache -f

      - name: Validate settings files
        id: settings
        if: always()
        continue-on-error: true
        working-directory: opensiddur-processor
        run: |
          uv run python -m opensiddur.exporter.books --check \
            --project-directory "$GITHUB_WORKSPACE/projects/project"

      - name: Gate
        if: always()
        run: |
          status=0
          for outcome in \
            "schema:${{ steps.schema.outcome }}" \
            "urn_references:${{ steps.urn_references.outcome }}" \
            "urn_registry:${{ steps.urn_registry.outcome }}" \
            "versification:${{ steps.versification.outcome }}" \
            "features:${{ steps.features.outcome }}" \
            "settings:${{ steps.settings.outcome }}" \
            "names:${{ steps.names.outcome }}"; do
            name="${outcome%%:*}"
            result="${outcome#*:}"
            if [ "${result}" != "success" ]; then
              echo "FAILED: ${name} (${result})"
              status=1
            fi
          done
          exit $status
