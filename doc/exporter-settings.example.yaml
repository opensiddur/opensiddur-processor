---
# Example exporter settings file.
# This file includes every currently supported exporter settings 
#
# Notes:
# - Project names must correspond to directories under `project/`.
# - `parallel.column_order` values: `primary_first` | `primary_last`
# - `typography.parallel.layout` values: `pages` | `pairs` | `interleaved`
# - `typography.paper` values: `a4paper` | `letterpaper` | `legalpaper` | `a5paper` | `b5paper` | `executivepaper`

# What these settings make, and how they differ from the same book's other settings files.
# Free text, optional.
description: >
  The Westminster Leningrad Codex with the JPS 1917 translation facing it.

# The book these settings format: the root file to compile. Optional; with it, the compiler
# needs only `-s`. Every settings file in opensiddur-projects/settings/<book>/ must have one,
# since each is built into a book at release.
book:
  project: tanakh-wlc-he
  file_name: index.xml
  title: Westminster Leningrad Codex   # optional

# The opensiddur-processor versions that build this book as it should be, as PEP 440 writes
# them. Optional. An older processor refuses the file instead of building a broken book. Main
# between releases is the development of the next (0.7.0.dev0 after 0.6.0), and meets a
# requirement of that release: `>=0.7.0` builds on main before 0.7.0 is cut.
requires_processor: ">=0.7.0"

# The forms the release (and `python -m opensiddur.exporter.books`) builds the book in: `html`,
# the electronic book, and `pdf`, the printed one. Optional; both by default.
formats:
  - html
  - pdf

priority:
  # Project priority for resolving `urn:x-opensiddur:` references to *texts* (transclusions)
  # The first entry will typically be the project you are compiling.
  # The lower priority projects can be used when the first project wants to import from others (eg, a siddur that borrows Tanach text from another source)
  transclusion:
    - tanakh-wlc-he
    - tanakh-jps-1917-en

  # Project priority for resolving `urn:x-opensiddur:` references to *instructions*
  instructions:
    - tanakh-wlc-he
    - tanakh-jps-1917-en

# Projects from which to include annotations
# *All* annotations from the given projects will be included.
annotations:
  - tanakh-wlc-he
  - tanakh-jps-1917-en

# Optional. Set the notes of each type only at the first occurrence of their target,
# instead of at every place its text is transcluded. The note's @type selects the flag.
# Instructions and citations are always set at every occurrence.
print_once:
  commentary: false
  editorial: false

# Optional parallel-text configuration. Omit to disable.
parallel:
  # Projects to search for parallel text content (in priority order)
  projects:
    - tanakh-wlc-he
    - tanakh-jps-1917-en
  # Column order for parallel text display in printed output
  column_order: primary_first

# Optional conditional setting declarations (processor init).
# Keys are tei:fs @type values; nested keys are tei:f @name values.
# Omit to leave conditional settings unset at compile start.
declarations:
  opensiddur:gregorian-date:
    year: 2024
    month: 10
    day: 3
  opensiddur:time:
    hour: 10
    minute: 30
    second: 0
  opensiddur:holiday:
    rosh-hashana: 1
    pesah: 0
  opensiddur:override:
    omit-tahanun: true
  # Prefaces, introductions and the like, and the title pages. Both default to true; a
  # siddur meant for daily use may leave them out.
  opensiddur:paratext:
    include: false
    title-page: false
  # Who is present. Unset means undefined, which keeps conditional passages together with
  # the instruction saying when to read them. Setting minyan true derives zimmun true.
  opensiddur:quorum:
    minyan: true
    present-not-eaten: false
  # Textual variants are selected by URN; see the URN section of schema/JLPTEI-3.md.
  opensiddur:variant:
    urn:x-opensiddur:condition:haggadah:maggid/lefikhakh/shirah_chadashah: true
  # Rite, for passages that differ by custom (most often the haftarah). Each rite is its own
  # binary, so several may be true at once and every selected variant is kept. Omitting this
  # group entirely leaves rite undefined, which keeps *all* variants along with the headings
  # naming whose custom they are — usually what a printed volume wants. The list is open;
  # see schema/JLPTEI-3.md for the known names.
  opensiddur:rite:
    ashkenaz: true
    teimani_baladi: true

# Editorial forms, selected during compilation (also for inline transclusion).
readings:
  abbreviations: abbreviated  # abbreviated | expanded

# How the electronic (adaptive) book starts, before its reader chooses otherwise; a printed
# book ignores it. The reader's own choices are remembered, and win.
electronic:
  day: now        # now: the device's clock, at the reader's place | none: no particular day,
                  # every passage that turns on the day shown with its rubric (a haggadah,
                  # read ahead of the seder)
  columns: both   # both | primary | parallel: the columns of parallel text shown
  psalm_titles: printed  # printed: as the edition titles them | uniform: one "Psalm 23" /
                        # "תהלים כג" heading per whole psalm, for a book compiled from
                        # editions that title their psalms differently

# Who distributes the book, and how to treat it once read. Every book carries the Open Siddur
# Project's notice and statement unless its settings say otherwise; either part is `none` to
# leave it out. A line that is a URL is a link, and `_words_` are emphasised.
distribution:
  # On the verso of the title page (a book with no title page: its own page at the front).
  # In the electronic book, after the title page.
  notice:
    logo: default         # default: the Open Siddur logo | none | a .png/.jpg, relative to
                          # this file
    logo_width: 1.25in
    position: bottom      # top | center | bottom of its page
    text:
      - Distributed by The Open Siddur Project
      - https://opensiddur.org
      - https://github.com/opensiddur
  # A bulleted list on the book's last page, after the colophon: `print` in the PDF,
  # `electronic` in the electronic book. The PDF sets it in typography.styles.back_notice, as
  # it does the notice in styles.distribution_notice.
  back_notice:
    electronic:
      - We strongly advise against printing sacred texts and art containing divine names as
        these copies must be regarded with reverence, complicating their casual treatment and
        disposal.
      - If you must dispose of a printed sacred text (one containing Divine Names), please
        locate the closest _genizah_ (often established by a synagogue) and contact its
        custodians for further instructions.
    print:
      - We strongly advise against making unnecessary printed copies of sacred texts and art
        containing divine names as these copies must be regarded with reverence, complicating
        their casual treatment and disposal.
      - If you must dispose of a printed sacred text (one containing Divine Names), please
        locate the closest _genizah_ (often established by a synagogue) and contact its
        custodians for further instructions.

# Output-format settings, read by the output stages: all of them by the TeX/PDF stage, and the
# ones a reflowing page can use by the electronic book (see doc/typography.md).
typography:
  # Every key below is optional, and every default is what this exporter produced
  # before any of it was configurable. doc/typography.md is the full reference:
  # every key, its type, its allowed values, its default and what it affects.
  #
  # Every key is also checked. An unknown key, a value outside a closed list, a
  # malformed length or a font chain with nothing installed is an error naming
  # the path, raised before anything is rendered.

  # Font families, each a chain tried in order — the first one installed wins,
  # and none of them being installed is an error rather than a silent fallback.
  # `latin` and `hebrew` always exist; declaring one replaces its default chain.
  # Declare your own and point a style at it by name.
  fonts:
    hebrew:
      - {name: "Frank Ruehl CLM", normal_size: 12}  # points; defines named size "normal"
      - {name: "Ezra SIL", normal_size: 12}
      - {name: "SBL Hebrew", normal_size: 13}
      - {name: "FreeSerif", normal_size: 12}
    latin: ["Linux Libertine O", "TeX Gyre Pagella", "FreeSerif"]

  page:
    paper: letterpaper       # a4paper | letterpaper | legalpaper | a5paper
                             # | b5paper | executivepaper | custom
    orientation: portrait    # portrait | landscape
    sides: two               # two: margins and running heads mirror between
                             # recto and verso. one: printed on one side only.
    binding: right           # right | left: the edge the book is bound at. Sets
                             # the PDF's reading direction, and with sides: two
                             # puts the inner margins at that edge.
    chapter_start: recto     # recto: a book opens on a recto (odd) page
    base_font_size: "11pt"   # 10pt | 11pt | 12pt — what named sizes scale from
    # Margins are named for the binding, not the page edge, so they mean the same
    # on a recto and a verso. Omitted margins keep the document class's own.
    margins:
      top: "1in"
      bottom: "1in"
      inner: "1.25in"        # at the binding edge
      outer: "0.9in"         # at the fore edge
      # binding_offset: "5mm"  # for the part of the page a binding swallows

  paragraphs:
    indent: "0pt"
    spacing: "0.5em"
    line_spacing: 1.0        # 0.5-3.0. Pointed Hebrew wants more than unpointed.
    alignment: justify       # justify | left | right | center

  # The appearance of each kind of text. Every role takes the same keys — font,
  # size, weight, style, variant, align, space_before, space_after — and an
  # omitted one leaves that aspect as the surrounding text has it. Sizes are the
  # named ladder (xxx-small ... xxxx-large), which follows the chosen font’s
  # normal_size (or the document base_font_size when omitted), or an
  # absolute length like 9pt, which does not.
  styles:
    heading1: {size: xx-large, weight: bold, align: center}
    heading2: {size: x-large, weight: bold, align: center}
    note: {size: "9pt"}
    note_mark: {size: xx-small}
    # ... and body, heading3, heading4, title_main, title_sub, title_alt,
    # byline, edition, imprint, epigraph, imprimatur, title_page_block,
    # citation, parsha, aliyah, verse_number, chapter_number, instruction,
    # line_number, section_separator. See doc/typography.md.

  line_numbers:
    enabled: true
    unit: page               # page | section — what numbering restarts at
    increment: 5             # a number every nth line
    first: 5                 # so they run 5, 10, 15 rather than 1, 5, 10
    margin: outer            # inner | outer | left | right
    separation: "1em"
    numerals: arabic         # arabic | hebrew

  notes:
    placement: footnote      # footnote | endnote | none
    anchor: interlinear      # interlinear: raised above the line and zero-width,
                             # so the annotated text is not respaced — which is
                             # what keeps two sides of a parallel text aligned.
                             # superscript | inline are the alternatives.
    mark: numeric            # numeric | alpha | roman | symbol

  markers:
    section_separator: "* * * *"   # between sections that carry no heading
    verse_numbers: shown           # shown | hidden
    chapter_numbers: shown
    # Only conditions the compiler could not decide survive into the output, so a
    # marker means "say this only if ...". A whole paragraph takes a rule rather
    # than brackets: brackets several lines apart do not read as a pair.
    conditional:
      inline_open: "["
      inline_close: "]"
      block: rule                  # rule | brackets | none
      rule_width: "25%"
      rule_thickness: "0.4pt"

  parallel:
    layout: pairs            # pairs: two columns on a page. pages: facing pages,
                             # which gives each text a full measure. interleaved:
                             # one column, each block followed by its translation.
    column_width: "43%"      # of the text block; the gap takes the remainder,
                             # which is also what leaves room for line numbers.
                             # pairs only, as is column_position: an error otherwise
    column_position: center  # left | center | right
    # Which text goes on which side — or, interleaved, which comes first — is
    # `parallel.column_order` above, not here.
    interleaved:             # only in `interleaved` layout
      translation_size: small     # a named size, or an absolute length
      translation_indent: 1em     # on both margins
      spacing: 0.25em             # between a block and its translation
      line_numbers: primary       # primary | both

  table_of_contents:
    enabled: false
    depth: 4                 # 1-4; independent of the PDF bookmark depth

  # Running heads and feet. Omitted, `page_header` names the current section on
  # the inner edge and numbers the page on the outer; `page_footer` stays empty.
  # Write `page_header: {}` for no running head at all.
  #
  # Each takes either `all` (the same on every page) or `odd` and/or `even`.
  # Combining `all` with `odd` or `even` is an error.
  #
  # `left`, `center` and `right` are *physical* page positions. Each is either a
  # bare string or a mapping of:
  #   text      - the template
  #   language  - the slot's base direction, which sets the order its runs are laid
  #               out in, and the font for anything that declares nothing else.
  #               Defaults to the document's own xml:lang; only Hebrew (he, he-*)
  #               vs. everything else matters. Each run carries its own direction
  #               inside that, so digits and mixed scripts are never reversed.
  #   if        - when this template expands to nothing, the whole position is
  #               dropped, literal text included.
  #
  # Text outside braces is literal; `{{` and `}}` are literal braces. The codes
  # are a closed list — an unrecognized one is an error:
  #   {page}                   page number as the document numbers it
  #   {page-hebrew}            page number in Hebrew numerals
  #   {document-title}         title from the TEI header (fixed for the document)
  #   {book-title}             head of the enclosing div[@type='book']
  #   {chapter-number}         n of the last chapter milestone
  #   {chapter-number-hebrew}  the same, in Hebrew numerals
  #   {head1} ... {head4}      last heading at that level
  #   {section-title}          last heading at any level
  #   {book-title-alt}, {head1-alt} ... {head4-alt}, {section-title-alt}
  #                            the same, from the second parallel column
  #
  # Everything but the page number and document title names what was in force at
  # the *end* of the page. Title pages never carry a running head or foot.
  page_header:
    odd:
      left: "{book-title}"
      right: {text: "Page {page}", language: en}
    even:
      left: {text: "{page-hebrew}", language: he}
      center: {text: "Chapter {chapter-number}", language: en, if: "{chapter-number}"}
  page_footer:
    all:
      center: {text: "{page}", language: en}

# Saturday-night additions (Birnbaum): opensiddur:motzaei-shabbat/omit-vihi-noam
# is derived from the Hebrew date and Israel/diaspora locale. It is true when
# Yom Tov falls Sunday–Friday of that Hebrew week. Erev Pesach alone does not
# cause omission. Missing date or locale leaves this condition undecided.
# opensiddur:observance/synagogue-havdalah selects the synagogue's shorter
# Havdalah opening; false includes the introductory verses for home recitation.

# Hallel (Birnbaum): opensiddur:hallel/recite and /full are derived from the
# Hebrew date and is-israel. Unknown dates/locales leave the choice MAYBE.
# Set recite: true and full: true explicitly to render complete Hallel.
# The siddur caller, not prayer:hallel itself, omits it when
# opensiddur:override/house-of-mourning is true, on every Hallel occasion.
# Psalm 115:1–11 and 116:1–11 alone are gated by /full. Following Kaddish
# belongs to siddur:hallel/kaddish; Rosh Hodesh takes priority over Hanukkah.

# Festival Kiddush: opensiddur:practice/in-sukkah is a manual Boolean with
# no default. Leave it unset to retain Birnbaum's “In the Sukkah:” instruction
# and conditional blessing; set it true/false for a particular meal.
# Candle-lighting Shehecheyanu uses the first two festival nights in the diaspora
# and the first in Israel, excluding the final days of Pesach.

# Kapparot (Birnbaum): opensiddur:practice/kapparot-object is a manual symbol:
# money, rooster, or hen. Leave it unset to show all alternatives as MAYBE.
# Example declaration: opensiddur:practice: {kapparot-object: money}
# The reusable prayer has no seasonal gate; its siddur caller selects 9 Tishrei.
# Tashlikh's caller selects 1 Tishrei except on Shabbat, when it selects 2 Tishrei.
