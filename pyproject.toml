[project]
name = "opensiddur-processor"
version = "0.9.0.dev0"
description = "AI-aided conversion and compilation pipeline for Open Siddur liturgical texts (JLPTEI v2)"
authors = [
    {name = "Efraim Feinstein", email = "efraim.feinstein@gmail.com"}
]
license = {text = "LGPL 3+"}
readme = "README.md"
requires-python = ">=3.12,<3.14"
keywords = [
    "open-siddur",
    "liturgy",
    "tei",
    "xml",
    "xslt",
    "hebrew",
    "pdf",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Religion",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: XML",
]
dependencies = [
    "requests>=2.32.4",
    "lxml>=5.3.0",
    "saxonche>=12.7.0",
    "mwparserfromhell>=0.7.2",
    "pydantic>=2.11.7",
    "pyluach>=2.3.0",
    "hdate>=1.2.1",
    "tzfpy>=1.3.2",
    "pillow>=11.0.0",
    "pyyaml>=6.0.3",
    "pypdf>=6.10.2",
    "packaging>=24.0",
    "tzdata>=2026.6 ; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://opensiddur.org/"
Repository = "https://github.com/opensiddur/opensiddur-processor"
Issues = "https://github.com/opensiddur/opensiddur-processor/issues"

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "coverage>=7.0.0",
    "ruff>=0.17.6,<1",
]
test = [
    "pytest>=8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opensiddur"]

[tool.ruff]
target-version = "py312"
# The submodules hold data, not code.
extend-exclude = ["sourcetexts", "opensiddur-projects"]

[tool.ruff.lint]
# Listed explicitly: ruff's default rule set changes between releases.
# E4/E7/E9: pycodestyle's import, statement and syntax errors; F: pyflakes; B: bugbear;
# I: import sorting; UP: newer syntax for the target Python; PLE: pylint's errors.
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "PLE"]
ignore = [
    # Several statements on one line. `ruff format` splits them; checked once the code
    # is formatted.
    "E701",
    "E702",
    # Style, not bugs: assigning a lambda, and the variable names l, O and I.
    "E731",
    "E741",
    # zip() without strict=: each of ~100 calls needs its own decision.
    "B905",
    # %-formatting: not fixed automatically.
    "UP031",
    # `type X = ...` makes a TypeAliasType, which pydantic and get_args() see differently.
    "UP040",
]

[tool.ruff.lint.per-file-ignores]
# These build on everything siddur_expanded.xml defines.
"opensiddur/importer/siddur_expanded/build.py" = ["F403", "F405"]
"opensiddur/importer/siddur_expanded/readings.py" = ["F403", "F405"]
# The Birnbaum builders import each section next to the code that uses it.
"opensiddur/importer/birnbaum_scan/build/*" = ["E402"]
