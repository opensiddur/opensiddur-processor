# Spellings of Hebrew words in project names, file names and URN path components.
# See specs/NAMING_SCHEME.md. Checked by `python -m opensiddur.common.validate_names`.
#
# The table in schema/JLPTEI-3.md#transliteration decides a word's spelling. These lists
# record the decisions the table does not make by itself.

# Words whose common spelling wins over the table. Only a word with a spelling of its own in
# English belongs here: kaddish and kiddush are English words, kedushah and qadosh are not.
exceptions:
  - chanukah    # the table gives chanukkah
  - chumash     # chummash
  - kaddish     # qaddish
  - kiddush     # qiddush

# A spelling that is not standard, and the standard spelling of the same word. List a word
# only if it cannot be another word: `selah` (סֶלָה) and `selach` (סְלַח) are both right, so
# neither is a variant of the other.
